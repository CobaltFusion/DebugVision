<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Software Oscilloscope</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
    <button>Click</button>
    <input type="button" value="Click">
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>

    <select>
        <option>Free running</option>
        <option>Triggered</option>
    </select>

    <div id="app">
        <div id="toolbar">
            <button id="runButton">Run</button>
            <button id="pauseButton">Pause</button>
            <span id="status">RUNNING</span>
        </div>

        <div id="main">
            <canvas id="scope"></canvas>

            <div id="sidebar">
                <div class="panel">
                    <h3>Signals</h3>
                    <ul id="signalList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="static/client.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Software Oscilloscope</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
    <div id="app">
        <div id="toolbar">
            <button id="runBtn">Run</button>
            <button id="pauseBtn">Pause</button>
            <span id="status">RUNNING</span>
        </div>

        <div id="main">
            <canvas id="scope"></canvas>

            <div id="sidebar">
                <div class="panel">
                    <h3>Signals</h3>
                    <ul id="signalList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="static/client.js"></script>
</body>

</html>
